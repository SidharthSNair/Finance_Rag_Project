<!DOCTYPE html>
<html>
<head>
    <title>Finance RAG QA</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        h1, h2 { color: #333; }
        form { margin-bottom: 20px; }
        input[type="text"] {
            width: 60%;
            padding: 8px;
            font-size: 16px;
        }
        button {
            padding: 8px 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Ask a Question 📚</h1>

    <!-- Question Form -->
    <form method="post" action="/ask">
        <input type="text" name="question" placeholder="Type your question here..." required>
        <button type="submit">Ask</button>
    </form>



    <!-- Upload Files -->
<h2>Upload Files</h2>
<input type="file" id="fileInput" multiple />
<button onclick="uploadFiles()">Upload Files</button>

    <h1>Agent (Multi-Tool)</h1>
<form method="post" action="/agent_ask">
  <input type="text" name="question" placeholder="Ask the agent..." required>
  <button type="submit">Ask Agent</button>
</form>





{% if answer %}
    <h2>Answer:</h2>
    <p>{{ answer }}</p>
{% endif %}

{% if sources %}
    <h3>Sources:</h3>
    <ul>
        {% for src in sources %}
            <li>{{ src }}</li>
        {% endfor %}
    </ul>
{% endif %}

    <h1>Ask a Question 📚 (Streaming)</h1>
    <input type="text" id="question" placeholder="Type your question here..." />
    <button onclick="sendQuestion()">Ask</button>

    <h2>Answer:</h2>
    <div id="answer" style="white-space: pre-wrap; border: 1px solid #ccc; padding: 10px;"></div>

<div id="sources"></div>


</body>
<script>
function sendQuestion() {
    const sessionId = crypto.randomUUID();  // or hardcode a string
    const ws = new WebSocket("ws://localhost:8000/ws/ask?session_id=" + sessionId);

    const question = document.getElementById("question").value;
    const answerDiv = document.getElementById("answer");
    const sourcesDiv = document.getElementById("sources");

    answerDiv.textContent = "";
    sourcesDiv.innerHTML = "";

    ws.onopen = () => {
        ws.send(question);
    };

    ws.onmessage = (event) => {
        try {
            // Try parsing as JSON to see if it's the final sources
            const json = JSON.parse(event.data);
            if (json.sources) {
                sourcesDiv.innerHTML = "<h3>Sources:</h3><ul>" +
                    json.sources.map(src => `<li>${src}</li>`).join('') +
                    "</ul>";
            }
        } catch {
            // If not JSON, treat as streamed token
            answerDiv.textContent += event.data;
        }
    };

    ws.onclose = () => {
        console.log("WebSocket closed");
    };
}
function uploadFiles() {
    const input = document.getElementById("fileInput");
    const files = input.files;
    const formData = new FormData();

    for (let i = 0; i < files.length; i++) {
        formData.append("files", files[i]);
    }

    fetch("http://localhost:8000/upload", {
        method: "POST",
        headers: {
                    "Accept": "application/json"
                  },
        body: formData
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Upload failed");
        }
        return response.json();
    })
    .then(data => {
        alert("Files uploaded successfully!");
        console.log("Server response:", data);
    })
    .catch(error => {
        alert("Upload failed: " + error.message);
        console.error(error);
    });
}




</script>
</html>
