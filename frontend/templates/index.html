<!DOCTYPE html>
<html>
<head>
    <title>Finance RAG QA</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        h1, h2 { color: #333; }
        form { margin-bottom: 20px; }
        input[type="text"] {
            width: 60%;
            padding: 8px;
            font-size: 16px;
        }
        button {
            padding: 8px 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Ask a Question 📚</h1>

    <!-- Question Form -->
    <form method="post" action="/ask">
        <input type="text" name="question" placeholder="Type your question here..." required>
        <button type="submit">Ask</button>
    </form>



    <!-- Upload Files -->
    <form method="post" action="/upload" enctype="multipart/form-data">
        <input type="file" name="files" multiple required>
        <button type="submit">Upload Files</button>
    </form>

{% if answer %}
    <h2>Answer:</h2>
    <p>{{ answer }}</p>
{% endif %}

{% if sources %}
    <h3>Sources:</h3>
    <ul>
        {% for src in sources %}
            <li>{{ src }}</li>
        {% endfor %}
    </ul>
{% endif %}

    <h1>Ask a Question 📚 (Streaming)</h1>
    <input type="text" id="question" placeholder="Type your question here..." />
    <button onclick="sendQuestion()">Ask</button>

    <h2>Answer:</h2>
    <div id="answer" style="white-space: pre-wrap; border: 1px solid #ccc; padding: 10px;"></div>


</body>
<script>
function sendQuestion() {
    const ws = new WebSocket("ws://localhost:8000/ws/ask");
    const question = document.getElementById("question").value;
    const answerDiv = document.getElementById("answer");
    answerDiv.innerText = "";

    ws.onopen = () => {
        ws.send(question);
    };

    ws.onmessage = (event) => {
        answerDiv.innerText += event.data;
    };

    ws.onclose = () => {
        console.log("WebSocket closed");
    };
}
</script>
</html>
